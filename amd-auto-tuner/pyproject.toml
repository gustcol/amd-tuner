[project]
name = "amd-auto-tuner"
version = "1.0.0"
description = "Automated performance tuning for AMD Ryzen/EPYC systems on Linux"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.ty]
python-version = "3.12"
src = ["."]

[tool.ty.rules]
# Disable import checking for project modules (runtime path manipulation)
unresolved-import = "ignore"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
